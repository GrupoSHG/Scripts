# Licitaciones de obras de Mercado Público (ChileCompra) -> Supabase m5.licitaciones_mp
# Una vez al día, dentro de la ventana de cargas masivas de la API (22:00-07:00 Chile).
# Lógica en M5_Systems/mercado-publico/descarga_diaria.py.
#
#   Secrets: MP_TICKET (ticket de la API de Mercado Público), SUPABASE_SERVICE_KEY

name: Licitaciones Mercado Público · M5

on:
  # Sin "schedule": lo dispara Supabase (automatizacion/disparador_workflows.sql).
  workflow_dispatch:
    inputs:
      activas:
        description: "Carga inicial: partir de todas las licitaciones activas"
        type: boolean
        default: false
      fecha:
        description: "Solo esta fecha (ddmmaaaa); vacío = hoy y ayer"
        required: false

concurrency:
  group: mercado-publico-m5
  cancel-in-progress: false

jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: M5_Systems/mercado-publico
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: M5_Systems

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fecha de Chile
        id: hoy
        run: echo "fecha=$(TZ=America/Santiago date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Contador de solicitudes del día: se conserva entre corridas del mismo día.
      - uses: actions/cache@v4
        with:
          path: M5_Systems/mercado-publico/estado
          key: mp-solicitudes-${{ steps.hoy.outputs.fecha }}-${{ github.run_id }}
          restore-keys: mp-solicitudes-${{ steps.hoy.outputs.fecha }}-

      - name: Descargar y filtrar
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACTIVAS: ${{ inputs.activas }}
          FECHA: ${{ inputs.fecha }}
        run: |
          args="--supabase"
          [ "$ACTIVAS" = "true" ] && args="$args --activas"
          [ -n "$FECHA" ] && args="$args --fecha $FECHA"
          python descarga_diaria.py $args

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licitaciones-mp-${{ steps.hoy.outputs.fecha }}
          path: M5_Systems/mercado-publico/salida/
          retention-days: 14
