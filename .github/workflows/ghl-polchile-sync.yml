# Sincronización CRM Polchile (GoHighLevel) -> Supabase schema polchile_crm
# Cada hora (lo dispara Supabase) copia pipelines, usuarios, oportunidades y contactos del
# CRM de Polchile para el Dashboard Gerencia Comercial. Lógica en Polchile_Systems/sync_ghl_polchile.py.
#
#   Secrets:   GHL_POLCHILE_TOKEN (Private Integration de Polchile), SUPABASE_SERVICE_KEY
#   Variables: GHL_POLCHILE_LOCATION (opcional; por defecto la subcuenta de Polchile, fija en el script)

name: Sincronizar CRM Polchile

on:
  # Sin "schedule": lo dispara Supabase (automatizacion/disparador_workflows.sql).
  workflow_dispatch:

concurrency:
  group: ghl-polchile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Polchile_Systems

      - name: Sincronizar
        env:
          GHL_POLCHILE_TOKEN: ${{ secrets.GHL_POLCHILE_TOKEN }}
          GHL_POLCHILE_LOCATION: ${{ vars.GHL_POLCHILE_LOCATION }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 Polchile_Systems/sync_ghl_polchile.py
