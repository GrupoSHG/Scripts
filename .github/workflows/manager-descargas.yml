# Robot de descargas de Manager -> Supabase (ver Polchile_Systems/manager-descargas/README.md)
# Lunes a viernes a las 09:07, 12:07, 15:07 y 18:07 (hora de Santiago, lo dispara
# Supabase; ver automatizacion/disparador_workflows.sql): exporta desde
# Manager Time ERP Documentos Pendientes (FAV), Ventas Full, Notas de Venta y OP
# asociadas a NV, y reemplaza documentos_pendientes_fav, ventas_full,
# notas_de_venta y ordenes_de_produccion en shg_dashboards.
#
# Secrets requeridos: RAMAFLEX_CORREO, RAMAFLEX_CLAVE, MANAGER_USUARIO, MANAGER_CLAVE, SUPABASE_SERVICE_KEY
# Si falla, las capturas de pantalla quedan como artefacto de la corrida, y el
# monitoreo avisa por correo si pasan más de 4 h sin carga.

name: Manager – descargas (4 veces al día)

# Sin "schedule": el de GitHub llega con horas de atraso. Lo dispara a la hora
# exacta Supabase (automatizacion/disparador_workflows.sql) o el botón "Run workflow".
on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Correr ahora aunque sea fuera de horario"
        type: boolean
        default: true
      sin_cargar:
        description: "Solo descargar (no reemplazar las tablas en Supabase)"
        type: boolean
        default: false

concurrency:
  group: manager-descargas
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Polchile_Systems/manager-descargas
    steps:
      - name: ¿Dentro de jornada?
        id: horario
        working-directory: .
        run: |
          h=$(TZ=America/Santiago date +%-H); d=$(TZ=America/Santiago date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.forzar }}" = "true" ]; then
            echo "correr=true" >> "$GITHUB_OUTPUT"
          elif [ "$d" -le 5 ] && [ "$h" -ge 9 ] && [ "$h" -le 18 ]; then
            echo "correr=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fuera de jornada (día $d, $h h en Santiago), no se corre."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.horario.outputs.correr == 'true'
        with:
          sparse-checkout: Polchile_Systems/manager-descargas

      - uses: actions/setup-python@v5
        if: steps.horario.outputs.correr == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Polchile_Systems/manager-descargas/requirements.txt

      - name: Instalar dependencias y Chromium
        if: steps.horario.outputs.correr == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Descargar informes y cargar a Supabase
        if: steps.horario.outputs.correr == 'true'
        env:
          RAMAFLEX_CORREO: ${{ secrets.RAMAFLEX_CORREO }}
          RAMAFLEX_CLAVE: ${{ secrets.RAMAFLEX_CLAVE }}
          MANAGER_USUARIO: ${{ secrets.MANAGER_USUARIO }}
          MANAGER_CLAVE: ${{ secrets.MANAGER_CLAVE }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python robot.py ${{ inputs.sin_cargar && '--sin-cargar' || '' }}

      - name: Subir capturas (para revisar si algo falla)
        if: always() && steps.horario.outputs.correr == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ github.run_id }}
          path: Polchile_Systems/manager-descargas/capturas/
          retention-days: 7
          if-no-files-found: ignore
