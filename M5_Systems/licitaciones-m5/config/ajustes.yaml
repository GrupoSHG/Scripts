# Ajustes técnicos del proceso. El perfil comercial de M5 está en perfil_m5.yaml.

api:
  base: https://api.mercadopublico.cl/servicios/v1/publico/
  timeout_conexion_s: 10
  timeout_lectura_s: 60
  reintentos: 4              # solo ante conexión caída, timeout, 429 y 5xx
  espera_base_s: 2           # espera creciente: 2, 4, 8, 16 s (+ azar)
  espera_maxima_s: 60        # tope de cada espera, también si la API manda Retry-After
  pausa_entre_llamadas_s: 3    # con 1,5 s hubo 429 en 12 de 33 solicitudes (ver NOTAS_API.md)

limites:
  solicitudes_diarias: 10000  # por ticket, según ChileCompra
  tope_pct: 80                # el proceso se detiene al llegar a este porcentaje

horario:
  zona: America/Santiago
  carga_masiva_desde: "22:00"   # ChileCompra pide descargas masivas solo de noche
  carga_masiva_hasta: "07:00"
  max_detalles_fuera_de_horario: 50   # más que esto fuera de la ventana exige --forzar

descarga:
  dias_atras: 1               # listado de hoy y de ayer (fecha=ddmmaaaa)
  estados_a_procesar: [5]     # 5 = Publicada
  max_errores_detalle: 10     # más detalles fallidos que esto hace fallar la corrida

evaluacion:
  modelo: claude-haiku-5-5    # el más pequeño y barato; cambiar aquí (debe estar en precios_usd_por_mtok)
  esfuerzo: low               # low | medium | high: cuánto razona el modelo antes de responder
  max_tokens: 4000            # por respuesta, incluido el razonamiento
  timeout_s: 120
  reintentos_sdk: 2           # el SDK reintenta 429, 5xx y caídas de conexión
  tope_gasto_diario_usd: 3.00 # antes de cada llamada se verifica que el peor caso no lo supere
                              # (subió de 1 a 3 el 26/10/2026 por la lectura de bases en PDF)
  max_revision_manual_por_json: 3   # más respuestas inválidas que esto hace fallar la corrida (código 6)
  # Recomendaciones que siguen al reporte y a Supabase. Las "descartar" quedan solo en
  # descartadas_claude.json; las de revisión manual se conservan siempre.
  conservar: [postular, revisar]
  # USD por millón de tokens, lista de Anthropic de octubre de 2026 (Haiku 5.5: hasta 100K tokens
  # de entrada por solicitud; sobre eso cobra 0,50/2,50). Escritura de caché = 1,25x la entrada.
  precios_usd_por_mtok:
    claude-haiku-5-5:  {entrada: 0.10, salida: 0.50,  cache_lectura: 0.01, cache_escritura: 0.125}
    claude-sonnet-5-5: {entrada: 2.00, salida: 10.00, cache_lectura: 0.20, cache_escritura: 2.50}
    claude-opus-5-5:   {entrada: 4.00, salida: 20.00, cache_lectura: 0.20, cache_escritura: 5.00}
  # Haiku 5.5 cobra 0,50/2,50 (x5) cuando una solicitud pasa de 100K tokens de entrada (PDF de bases).
  contexto_largo:
    claude-haiku-5-5: {umbral_tokens: 100000, factor: 5}

precios_oc:
  # Precios de referencia de materiales desde órdenes de compra de Mercado Público (m5.precios_oc_items).
  # Corre dentro del comando diario, después de las licitaciones (ventana nocturna).
  activo: true
  dias_atras: 1               # órdenes de compra de ayer (el listado de hoy aún está incompleto)
  max_ocs_noche: 300          # detalles por noche (1 solicitud cada uno, mismo tope diario del ticket)
  tamano_lote: 25             # ítems por llamada a Claude

bases:
  # Lectura con Claude de los PDF de bases que M5 sube en licitaciones.html (comando `bases`,
  # workflow licitaciones-bases.yml y, como respaldo, el comando diario).
  modelo: claude-haiku-5-5
  esfuerzo: low
  max_tokens: 32000           # salida (lista de materiales); se usa streaming
  max_mb: 30                  # PDF más grande que esto queda en error sin enviarlo a Claude
  max_por_corrida: 5          # PDF pendientes por corrida
  tope_por_documento_usd: 0.80  # si el peor caso de un PDF supera esto, queda en error sin gastar

fichas:
  # Ficha de postulación desde las bases (fichas.py): requisitos, garantías, criterios, contrato, riesgos,
  # checklist y recomendación. Corre dentro del comando diario, después de evaluar y guardar. Los PDF son
  # los que M5 sube en licitaciones.html (la API no entrega las bases); sin PDF queda "adjuntos pendientes".
  activo: true
  puntaje_minimo: 4           # puntaje de la evaluación desde el que se arma ficha (y no "descartar")
  modelo: claude-haiku-5-5    # extracción; debe estar en evaluacion.precios_usd_por_mtok
  modelo_grande: claude-sonnet-5-5
  monto_modelo_grande_clp: 1000000000   # licitaciones con monto estimado desde aquí usan modelo_grande
  esfuerzo: medium            # con low se saltó los anexos obligatorios en las bases reales de 3836-36-LP26
  max_tokens: 16000           # por respuesta (la extracción es larga)
  max_mb: 25                  # PDF más grande que esto no se descarga
  max_caracteres_por_parte: 120000      # ~35K tokens por parte: en partes más chicas el modelo omite menos datos
  min_caracteres_por_pagina: 40         # menos texto que esto = página sin texto (escaneada)
  max_por_corrida: 5          # licitaciones con PDF por corrida
  max_pendientes_por_corrida: 20        # fichas "adjuntos pendientes" (sin Claude, 1 solicitud a la API c/u)
  tope_por_corrida_usd: 1.50  # además del tope diario de evaluacion; al llegar, lo que falta queda para mañana
  pausa_descargas_s: 2        # entre PDF de una misma licitación
  dias_habiles_alerta: 5      # alerta destacada si el cierre está a menos de estos días hábiles
  url_ficha: https://gruposhg-m5-proyectos.netlify.app/licitaciones.html?ficha={}
  # Feriados de Chile (días hábiles). Revisar cada año en https://www.feriados.cl
  feriados: [2026-01-01, 2026-04-03, 2026-04-04, 2026-05-01, 2026-05-21, 2026-06-21, 2026-06-29, 2026-07-16,
             2026-08-15, 2026-09-18, 2026-09-19, 2026-10-12, 2026-10-31, 2026-11-01, 2026-12-08, 2026-12-25,
             2027-01-01, 2027-03-26, 2027-03-27, 2027-05-01, 2027-05-21, 2027-06-21, 2027-06-28, 2027-07-16,
             2027-08-15, 2027-09-18, 2027-09-19, 2027-10-11, 2027-10-31, 2027-11-01, 2027-12-08, 2027-12-25]

reporte:
  dias_cierre: 7             # sección "cierran en los próximos N días"
  max_mejores: 10             # cuántas mostrar en "mejores del día"
  max_sin_evaluar: 30         # lista compacta de las que cierran pronto sin evaluación

supabase:
  esquema: m5                 # tabla m5.licitaciones_mp
  timeout_s: 30
  # Clave PUBLICABLE del proyecto (pública: es la misma que usan las páginas web). Solo identifica
  # el proyecto ante la pasarela; los permisos los da SUPABASE_KEY (JWT del rol licitaciones_m5).
  apikey_publica: sb_publishable_7UxU-do4iR5rP7Fnx8kQiw_XqDLMaHc

filtro:
  # Categorías UNSPSC de servicios de construcción: un ítem con ese prefijo basta para pasar el
  # filtro fino aunque ninguna palabra clave aparezca en el texto.
  prefijos_rubro_unspsc: ["7210", "7211", "7212", "7213", "7214", "7215"]

# Códigos de estado de licitación verificados contra la API (ver NOTAS_API.md).
# La documentación oficial dice 18 = Revocada y 19 = Suspendida; la API devuelve 15 y 16.
estados:
  5: Publicada
  6: Cerrada
  7: Desierta
  8: Adjudicada
  15: Revocada
  16: Suspendida
