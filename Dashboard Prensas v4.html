const {useState, useRef, useEffect, useCallback} = React;

// ── Tweaks system ─────────────────────────────────────────────────────────────

function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  // Expose to child components via window
  window.__tweakVals = values;
  const setTweak = useCallback((key, val) => {
    setValues(prev => {
      const next = {...prev, [key]: val};
      window.__tweakVals = next;
      return next;
    });
  }, []);
  window.__tweakSet = setTweak;
  return [values, setTweak];
}

function TweaksPanel({title = 'Tweaks', children, open, onClose}) {
  const dragRef = useRef(null);
  const offsetRef = useRef({x: 16, y: 16});
  const PAD = 16;

  const clampToViewport = useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined'
      ? new ResizeObserver(clampToViewport)
      : null;
    if (ro) ro.observe(document.documentElement);
    else window.addEventListener('resize', clampToViewport);
    return () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', clampToViewport); };
  }, [open, clampToViewport]);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy)};
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <div ref={dragRef} className="twk-panel" style={{right: offsetRef.current.x, bottom: offsetRef.current.y}}>
      <div className="twk-hd" onMouseDown={onDragStart}>
        <b>{title}</b>
        <button className="twk-x" aria-label="Cerrar" onMouseDown={e => e.stopPropagation()} onClick={onClose}>✕</button>
      </div>
      <div className="twk-body">{children}</div>
    </div>
  );
}

function TweakSection({title, children}) {
  return (
    <>
      <div className="twk-sect">{title}</div>
      {children}
    </>
  );
}

function TweakSlider({id, label, min = 0, max = 100, step = 1, unit = ''}) {
  const value = window.__tweakVals?.[id] ?? min;
  const onChange = (v) => window.__tweakSet?.(id, v);
  return (
    <div className="twk-row">
      <div className="twk-lbl">
        <span>{label}</span>
        <span className="twk-val">{value}{unit}</span>
      </div>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={e => onChange(Number(e.target.value))} />
    </div>
  );
}

function TweakToggle({id, label}) {
  const value = window.__tweakVals?.[id] ?? false;
  const onChange = () => window.__tweakSet?.(id, !value);
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value} onClick={onChange}><i/></button>
    </div>
  );
}

function buildGroups() {
  const groups = {};
  OPS.forEach(o => {
    if (!groups[o.group]) groups[o.group] = {
      key: o.group, q: o.q, esp: o.esp,
      tipo: o.tipo.split(' ')[0],
      pieles: o.pieles.replace(/9003|7024|7040|9017|7021|ZA|FOIL/g, '·'),
      items: [], totalMl: 0
    };
    groups[o.group].items.push(o);
    groups[o.group].totalMl += o.ml;
  });
  return Object.values(groups).sort((a, b) => b.totalMl - a.totalMl);
}

function distribute(groups, purpUtilM, purpCycleMin, polpSetupMin, jornadaH, isoDoubleLoad) {
  const presses = ALL_PRESSES.map(p => ({
    p, cap: CAP[p], canPurp: PURP_PRESSES.includes(p),
    groups: [], baseH: 0, extraH: 0, totalH: 0, days: 0, ml: 0, m2: 0, ops: 0,
    groupBuckets: {}
  }));
  const purpEligible = presses.filter(p => p.canPurp);

  // PurP: distribute proportional to capacity among P1/P3/P4/P5
  const purpGroups = groups.filter(g => g.q === 'PurP');
  const totalPurpCap = purpEligible.reduce((a, p) => a + p.cap, 0);

  purpGroups.forEach(g => {
    g.cycles = Math.ceil(g.totalMl / purpUtilM);
    g.doubleLoad = false; g.effectiveMl = g.totalMl;
    g.baseH = 0; g.extraH = 0;
    g.items.forEach(it => {
      let assignedMl = 0;
      purpEligible.forEach((p, idx) => {
        const share = p.cap / totalPurpCap;
        const isLast = idx === purpEligible.length - 1;
        const portionMl = isLast ? (it.ml - assignedMl) : it.ml * share;
        const portionM2 = it.m2 * (portionMl / it.ml);
        if (portionMl < 0.01) return;
        const dur = portionMl / p.cap;
        const portionCycles = Math.ceil(portionMl / purpUtilM);
        const portionExtraH = (portionCycles * purpCycleMin) / 60;
        if (!p.groupBuckets[g.key]) {
          const bucket = {
            g: {...g, items: [], assignedTo: p.p, baseH: 0, extraH: 0, doubleLoad: false, effectiveMl: 0, totalMl: 0, cycles: 0},
            items: [], baseH: 0, extraH: 0, doubleLoad: false
          };
          p.groupBuckets[g.key] = bucket;
          p.groups.push(bucket.g);
        }
        const bk = p.groupBuckets[g.key];
        const subItem = {...it, ml: portionMl, m2: portionM2, _split: true, _origMl: it.ml};
        bk.items.push(subItem); bk.g.items.push(subItem);
        bk.baseH += dur; bk.extraH += portionExtraH;
        bk.g.baseH += dur; bk.g.extraH += portionExtraH;
        bk.g.totalMl += portionMl; bk.g.effectiveMl += portionMl; bk.g.cycles += portionCycles;
        p.baseH += dur; p.extraH += portionExtraH;
        p.totalH = p.baseH + p.extraH;
        p.ml += portionMl; p.m2 += portionM2;
        p.ops += 1 / purpEligible.length;
        p.days = p.totalH / jornadaH;
        g.baseH += dur; g.extraH += portionExtraH;
        assignedMl += portionMl;
      });
    });
  });

  // PolP: balanced distribution — non-PurP presses absorb more PolP so all 7 converge to the same target_H
  const polpGroups = groups.filter(g => g.q === 'PolP');
  const totalPolpEffMl = polpGroups.reduce((a, g) => {
    const isISO = g.tipo === 'PolP-ISO';
    const dl = isISO && isoDoubleLoad;
    return a + g.items.reduce((s, it) => s + (dl ? it.ml / 2 : it.ml), 0);
  }, 0);
  const totalCap = presses.reduce((a, p) => a + p.cap, 0);
  const totalPurpMl = purpGroups.reduce((a, g) => a + g.totalMl, 0);
  const targetH = (totalPurpMl + totalPolpEffMl) / totalCap;
  const purpHperPurpPress = totalPurpCap > 0 ? totalPurpMl / totalPurpCap : 0;
  const polpQuotaMl = {};
  presses.forEach(p => {
    const purpH = p.canPurp ? purpHperPurpPress : 0;
    polpQuotaMl[p.p] = Math.max(0, (targetH - purpH) * p.cap);
  });
  const totalPolpQuota = Object.values(polpQuotaMl).reduce((a, b) => a + b, 0) || 1;

  polpGroups.forEach(g => {
    const isISO = g.tipo === 'PolP-ISO';
    const doubleLoad = isISO && isoDoubleLoad;
    g.items.forEach(it => {
      const effItemMl = doubleLoad ? it.ml / 2 : it.ml;
      let assignedMl = 0;
      presses.forEach((p, idx) => {
        const share = polpQuotaMl[p.p] / totalPolpQuota;
        const isLast = idx === presses.length - 1;
        const portionEffMl = isLast ? (effItemMl - assignedMl) : effItemMl * share;
        const portionMl = doubleLoad ? portionEffMl * 2 : portionEffMl;
        const portionM2 = it.m2 * (portionMl / it.ml);
        if (portionEffMl < 0.01) return;
        const dur = portionEffMl / p.cap;
        if (!p.groupBuckets[g.key]) {
          const bucket = {
            g: {...g, items: [], assignedTo: p.p, baseH: 0, extraH: polpSetupMin / 60, doubleLoad, effectiveMl: 0, totalMl: 0},
            items: [], baseH: 0, extraH: polpSetupMin / 60, doubleLoad
          };
          p.groupBuckets[g.key] = bucket;
          p.groups.push(bucket.g);
          p.extraH += polpSetupMin / 60;
        }
        const bk = p.groupBuckets[g.key];
        const subItem = {...it, ml: portionMl, m2: portionM2, _split: true, _origMl: it.ml};
        bk.items.push(subItem); bk.g.items.push(subItem);
        bk.baseH += dur; bk.g.baseH += dur;
        bk.g.totalMl += portionMl; bk.g.effectiveMl += portionEffMl;
        p.baseH += dur;
        p.totalH = p.baseH + p.extraH;
        p.ml += portionMl; p.m2 += portionM2;
        p.ops += 1 / presses.length;
        p.days = p.totalH / jornadaH;
        assignedMl += portionEffMl;
      });
    });
  });

  presses.forEach(p => p.ops = Math.round(p.ops));

  const groupPresses = {};
  presses.forEach(p => Object.keys(p.groupBuckets).forEach(k => {
    groupPresses[k] = (groupPresses[k] || []);
    groupPresses[k].push(p.p);
  }));
  groups.forEach(g => { g.splitAcross = groupPresses[g.key] || []; });

  return presses;
}

                );
              })}
              <div style={{display:'flex',gap:14,fontSize:11,color:'var(--text-2)',marginTop:14,flexWrap:'wrap',marginLeft:72}}>
                <span style={{display:'inline-flex',alignItems:'center',gap:6}}><span style={{width:10,height:10,borderRadius:2,background:'var(--polp)'}}/>PolP</span>
                <span style={{display:'inline-flex',alignItems:'center',gap:6}}><span style={{width:10,height:10,borderRadius:2,background:'var(--purp)'}}/>PurP (incluye ciclos)</span>
                <span style={{fontSize:10,color:'var(--text-3)'}}>Tooltip: pasa el mouse para ver OPs, ML y ciclos</span>
              </div>
            </div>
          );
        })()}
      </div>

      <div className="section-header"><div className="section-title">Detalle de OPs y planchas (BCS)</div></div>
      <div className="card" style={{padding:'16px 0',overflow:'auto'}}>
        <table>
          <thead>
            <tr>
              <th style={{paddingLeft:22}}>OP</th>
              <th>NV</th>
              <th>Q</th>
              <th>Tipo · esp · pieles</th>
              <th style={{textAlign:'right'}}>M² total</th>
              <th style={{textAlign:'right'}}>Fabric.</th>
              <th style={{textAlign:'right'}}>Pendiente</th>
              <th style={{textAlign:'right'}}>ML</th>
              <th>Plan de corte (BCS)</th>
              <th>Asignación</th>
            </tr>
          </thead>
          <tbody>
            {OPS.map(o => {
              const g = groups.find(gg => gg.key === o.group);
              const pctDone = o.qOp > 0 ? (o.qTerm / o.qOp * 100) : 0;
              return (
                <tr key={o.op}>
                  <td style={{paddingLeft:22,fontWeight:500}}>{o.op}</td>
                  <td>{o.nv === 'STK' ? <span style={{color:'var(--text-3)',fontSize:10}}>STOCK</span> : `NV ${o.nv}`}</td>
                  <td><span className={`chip ${o.q.toLowerCase()}`}>{o.q}</span></td>
                  <td style={{fontSize:11.5}}>{o.tipo} · e{o.esp} · {o.pieles}</td>
                  <td style={{textAlign:'right'}}>{o.qOp.toFixed(0)}</td>
                  <td style={{textAlign:'right',color:pctDone>0?'var(--purp)':'var(--text-3)',fontWeight:pctDone>0?500:400}}>{o.qTerm>0?`${o.qTerm.toFixed(0)} (${pctDone.toFixed(0)}%)`:'—'}</td>
                  <td style={{textAlign:'right',fontWeight:600,color:'var(--coral)'}}>{o.m2.toFixed(0)}</td>
                  <td style={{textAlign:'right'}}>{o.ml.toFixed(0)}</td>
                  <td style={{fontSize:10.5,color:'var(--text-2)',maxWidth:240}}>{o.plan}</td>
                  <td style={{fontSize:11}}><b>{g?.splitAcross?.join(' + ') || g?.assignedTo}</b> <span style={{color:'var(--text-3)'}}>({g?.key})</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="section-header"><div className="section-title">Recomendaciones</div></div>
      <div className="card">
        <ol style={{marginLeft:18,fontSize:12.5,lineHeight:1.8}}>
          <li><b>PurP repartido en P1/P3/P4/P5:</b> las {purpOps.length} OPs de poliuretano se dividen <b>parejo</b> entre las 4 prensas habilitadas (proporcional a capacidad). Cada prensa acumula sus propios ciclos sobre su porción de ML.</li>
          <li><b>OP gigante 24063 (LAB 37):</b> 2.152,8 m² de PurP4 e30 9003 — al dividirla parejo, cada prensa PurP toma ~538 m² (~538 ML, ~54 ciclos). Programar como bloque continuo para amortizar setups.</li>
          <li><b>PolP repartido en las 7 prensas:</b> cada OP PolP se divide proporcional a la capacidad de cada prensa. Las prensas sin PurP (P2/P6/P7) reciben solo PolP, lo que las libera para absorber stock e ISO.</li>
          <li><b>Stock distribuido parejo:</b> las 5 OPs de stock (24126, 24438, 24543, 24545, 24547) se trocean entre las 7 prensas — el ISO aprovecha doble carga ×2 reduciendo su tiempo a la mitad.</li>
          <li><b>Aprovechar agrupaciones:</b> el grupo <b>POLP-PC4-Ban-e50</b> reúne {groups.find(g => g.key === 'POLP-PC4-Ban-e50')?.items.length || 0} OPs de distintos colores (9003, 7024, ZA) en un solo setup por prensa.</li>
          <li><b>⚠ Caso especial — OP 24172 (PurP6 PC6 ancho 910):</b> ancho no estándar y química PC6. Confirmar si va a una prensa específica o si la división parejo es válida.</li>
        </ol>
      </div>

      <footer>
        <span>Fuente: NOMBREOPS 08-05-2026 · BCS 08-05-2026</span>
        <span>Modelo: agrupación por familia (química+espesor+pieles, ignorando color) · restricción PurP P1/P3/P4/P5 · ciclo PurP {purpUtilM}m/{purpCycleMin}min</span>
      </footer>

      <TweaksPanel title="Tweaks" open={tweaksOpen} onClose={() => setTweaksOpen(false)}>
        <TweakSection title="PurP">
          <TweakSlider id="purpUtilM" label="Metros útiles por ciclo PurP" min={5} max={15} step={1}/>
          <TweakSlider id="purpCycleMin" label="Min curado/ciclo" min={10} max={60} step={5}/>
        </TweakSection>
        <TweakSection title="PolP">
          <TweakSlider id="polpSetupMin" label="Min setup por grupo PolP" min={5} max={45} step={5}/>
          <TweakToggle id="isoDoubleLoad" label="ISO: doble carga (×2)"/>
        </TweakSection>
        <TweakSection title="Jornada">
          <TweakSlider id="jornadaH" label="Horas por turno" min={6} max={12} step={0.5}/>
        </TweakSection>
      </TweaksPanel>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
