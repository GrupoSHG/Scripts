<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <base target="_top"/>
  <title>Polchile · Dashboard Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<style>
#polchile-nav{display:flex;align-items:center;background:#000;padding:0 20px;height:40px;border-bottom:1px solid #232932;font-family:monospace;gap:4px;position:sticky;top:0;z-index:9999;}
#polchile-nav .nav-logo{font-size:10px;font-weight:700;letter-spacing:2px;color:#d4ff5a;margin-right:12px;}
#polchile-nav a{padding:4px 12px;font-size:10px;font-weight:700;letter-spacing:1px;text-decoration:none;border-radius:4px;border:1px solid transparent;color:#8a94a3;transition:all 0.15s;}
#polchile-nav a:hover{color:#d4ff5a;border-color:#d4ff5a;}
#polchile-nav a.active{color:#d4ff5a;border-color:#d4ff5a;background:rgba(212,255,90,0.08);}
#polchile-nav .nav-time{margin-left:auto;font-size:10px;color:#8a94a3;letter-spacing:1px;}
</style>
<div id="polchile-nav">
  <span class="nav-logo">⬡ POLCHILE</span>
  <a href="https://cockpit-comericial-web.netlify.app/" class="active">COMERCIAL</a>
  <a href="https://polchile-produccion.netlify.app/">PRODUCCION</a>
  <a href="https://dashboard-finanzasweb.netlify.app/">FINANZAS</a>
  <a href="https://calendario-despachos.netlify.app/">CALENDARIO</a>
  <span class="nav-time" id="nav-clock"></span>
</div>
<script>
(function(){var clk=document.getElementById('nav-clock');function tick(){var d=new Date(),h=d.getHours().toString().padStart(2,'0'),m=d.getMinutes().toString().padStart(2,'0'),s=d.getSeconds().toString().padStart(2,'0');if(clk)clk.textContent=h+':'+m+':'+s;}tick();setInterval(tick,1000);})();
</script>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    // ⚠️ AJUSTAR: URL /exec de tu deployment de Apps Script
    window.__SCRIPT_URL__ = 'https://script.google.com/macros/s/AKfycbzdTfqrkCRPTMa0HBcDrDHjxuYBZTSe7G3nGB5EfK_FvElA6jmgsF7-ShQFc-4ntclb/exec';
  </script>

  <!-- Shim que reemplaza google.script.run por fetch() -->
  <script src="/google-script-shim.js"></script>

  <!-- Datos base + __loadLiveData (antes Data.html) -->
  <script src="/data.js"></script>

  <!-- Tabs (antes incluidos vía include() de Apps Script) -->
  <script type="text/babel" src="/tabs/tab-exec.js"></script>
  <script type="text/babel" src="/tabs/tab-daily.js"></script>
  <script type="text/babel" src="/tabs/tab-team.js"></script>
  <script type="text/babel" src="/tabs/tab-glosario.js"></script>
  <script type="text/babel" src="/tabs/tab-resumen.js"></script>
  <script type="text/babel" src="/tabs/tab-chipax.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    function App() {
      // Resumen es el tab inicial
      const [tab,      setTab]      = useState('resumen');
      const [scenario, setScenario] = useState('base');
      const [,         force]       = useState(0);
      useEffect(() => {
        const refreshData = () => {
          if (window.__loadLiveData) {
            console.log("Sincronizando datos con el Sheet...");
            window.__loadLiveData();
          }
        };
        window.__rerender = () => force(x => x + 1);
        refreshData();
        const interval = setInterval(refreshData, 300000);
        return () => clearInterval(interval);
      }, []);
      // Exponer setTab globalmente para que TabResumen pueda navegar
      window.__setTab = setTab;
      const extraTabs = [
        { id: 'resumen', label: '🏢 Grupo Empresas' },
        { id: 'chipax',  label: '💰 M5 · Finanzas'  },
      ];
      return (
        <>
          {window.Topbar && (
            <window.Topbar
              tab={tab}
              setTab={setTab}
              scenario={scenario}
              setScenario={setScenario}
              extraTabs={extraTabs}
            />
          )}
          <div className="page">
            {window.Ribbon && <window.Ribbon/>}
            {tab === 'resumen' && window.ResumenTab  && <window.ResumenTab/>}
            {tab === 'exec'    && window.ExecTab     && <window.ExecTab/>}
            {tab === 'daily'   && window.DailyTab    && <window.DailyTab/>}
            {tab === 'team'    && window.TeamTab     && <window.TeamTab/>}
            {tab === 'chipax'  && window.ChipaxTab   && <window.ChipaxTab/>}
            {tab === 'glosario'&& window.GlosarioTab && <window.GlosarioTab/>}
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
