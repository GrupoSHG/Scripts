  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    window.__SCRIPT_URL__ = '<?= scriptUrl ?>';

  <?!= include('TabExec'); ?>
  <?!= include('TabDaily'); ?>
  <?!= include('TabTeam'); ?>
  <?!= include('TabGlosario'); ?>
  <?!= include('TabResumen'); ?>
  <?!= include('TabChipax'); ?>

<script type="text/babel">
  const { useState, useEffect } = React;

  function App() {
    // Resumen es el tab inicial
    const [tab,      setTab]      = useState('resumen');
    const [scenario, setScenario] = useState('base');
    const [,         force]       = useState(0);

    useEffect(() => {
      const refreshData = () => {
        if (window.__loadLiveData) {
          console.log("Sincronizando datos con el Sheet...");
          window.__loadLiveData();
        }
      };

      window.__rerender = () => force(x => x + 1);
      refreshData();
      const interval = setInterval(refreshData, 300000);
      return () => clearInterval(interval);
    }, []);

    // Exponer setTab globalmente para que TabResumen pueda navegar
    window.__setTab = setTab;

    const extraTabs = [
      { id: 'resumen', label: '🏢 Grupo Empresas' },
      { id: 'chipax',  label: '💰 M5 · Finanzas'  },
    ];

    return (
      <>
        {window.Topbar && (
          <window.Topbar
            tab={tab}
            setTab={setTab}
            scenario={scenario}
            setScenario={setScenario}
            extraTabs={extraTabs}
          />
        )}
        <div className="page">
          {window.Ribbon && <window.Ribbon/>}

          {tab === 'resumen' && window.ResumenTab  && <window.ResumenTab/>}
          {tab === 'exec'    && window.ExecTab     && <window.ExecTab/>}
          {tab === 'daily'   && window.DailyTab    && <window.DailyTab/>}
          {tab === 'team'    && window.TeamTab     && <window.TeamTab/>}
          {tab === 'chipax'  && window.ChipaxTab   && <window.ChipaxTab/>}
          {tab === 'glosario'&& window.GlosarioTab && <window.GlosarioTab/>}
        </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
