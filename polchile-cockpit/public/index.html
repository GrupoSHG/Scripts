<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyBE4vPqxZcc6LTIsRDqLqFVjNDa5FM-gxg",
    authDomain:        "polchile-cockpit.firebaseapp.com",
    projectId:         "polchile-cockpit",
    storageBucket:     "polchile-cockpit.firebasestorage.app",
    messagingSenderId: "745084909262",
    appId:             "1:745084909262:web:09aede3c95dd6ba8bf429f"
  });
  const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/polchile.cl/s/AKfycbyZnxhHco_1WgiF0h4HKciBiL9ikHtcHgCyBd334gs/exec';

  async function doLogin() {
    const email = document.getElementById('inp-email').value.trim();
    const pass  = document.getElementById('inp-password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    try {
      await firebase.auth().signInWithEmailAndPassword(email, pass);
    } catch(e) {
      errEl.textContent = 'Correo o contraseña incorrectos.';

  firebase.auth().onAuthStateChanged(async user => {
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('root').style.display = 'block';
      if (window.__renderApp) window.__renderApp(null, user.email);
      try {
        const res     = await fetch(`${APPS_SCRIPT_URL}?action=data`);
        const payload = await res.json();
        if (window.__applyPayload) window.__applyPayload(payload);
        if (window.__renderApp)    window.__renderApp(payload, user.email);
      } catch(err) {
        console.error('Error cargando datos:', err);
        if (window.__renderApp) window.__renderApp(null, user.email);
      }
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('root').style.display = 'none';
    }
  });
</script>

<script type="text/babel">
/* global React, ReactDOM */
const { useState, useMemo } = React;
const D = window.PCH;

// ============================================================
// HELPERS
// ============================================================
const fmt = (n, dec=0) => {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('es-CL', { minimumFractionDigits: dec, maximumFractionDigits: dec });
};
const fmtM        = (n, dec=1) => fmt(n, dec);
const fmtPct      = (n, dec=0) => (n>=0?'+':'') + fmt(n, dec) + '%';
const fmtPctSimple= (n, dec=0) => fmt(n, dec) + '%';

const Delta = ({ v, suffix='%' }) => {
  const cls   = v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  const arrow = v > 0 ? '▲' : v < 0 ? '▼' : '–';
  return <span className={'delta ' + cls}>{arrow} {Math.abs(v).toFixed(1)}{suffix}</span>;
};

// ============================================================
// TOPBAR
// ============================================================
function Topbar({ tab, setTab, scenario, setScenario, userEmail, onLogout }) {
  const tabs = [
    { id:'exec',     label:'Resumen Ejecutivo' },
    { id:'daily',    label:'Operativa Diaria'  },
    { id:'team',     label:'Equipo Comercial'  },
    { id:'glosario', label:'Glosario y Fuentes'},
  ];
  const initials = (userEmail || '').split('@')[0].slice(0,2).toUpperCase();
  return (
    <div className="topbar">
      <div className="brand">
        <div className="brand-mark">P</div>
        <div className="brand-name">POLCHILE <span>Comercial Cockpit</span></div>
      </div>
      <div className="tabs">
        {tabs.map(t => (
          <button key={t.id} className={'tab '+(tab===t.id?'active':'')} onClick={() => setTab(t.id)}>
            <span className="dot"></span>{t.label}
          </button>
        ))}
      </div>
      <div className="topbar-right">
        <div className="scenario-pill">
          {['pesimista','base','optimista'].map(s => (
            <button key={s} className={scenario===s?'active':''} onClick={() => setScenario(s)}>
              {s==='pesimista'?'PES -20%':s==='base'?'BASE':'OPT +20%'}
            </button>
          ))}
        </div>
        <div className="live-status">
          <span className="live-dot"></span>
          <span>Manager · GHL</span>
          <span className="text-3">· En vivo</span>
        </div>
        <div className="user-chip">
          <div className="avatar">{initials}</div>
          <div>
            <div className="text-1 fw-6">{userEmail || 'Usuario'}</div>
            <div className="text-3 fs-10">Polchile SpA</div>
          </div>
        </div>
        <button className="logout-btn" onClick={onLogout}>Salir</button>
      </div>
    </div>
  );
}

// ============================================================
// RIBBON
// ============================================================
function Ribbon() {
  const fecha           = new Date();
  const diasSemana      = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const currentMonthIdx = fecha.getMonth();
  const txtHoy          = `${diasSemana[fecha.getDay()]} ${fecha.getDate()} ${window.PCH.MESES[currentMonthIdx]} ${fecha.getFullYear()}`;
  const totalDias       = new Date(fecha.getFullYear(), currentMonthIdx+1, 0).getDate();
  const avanceMes       = Math.round((fecha.getDate() / totalDias) * 100);
  const txtPeriodo      = `${window.PCH.MESES_LARGO[currentMonthIdx]} ${fecha.getFullYear()} · día ${fecha.getDate()} de ${totalDias}`;
  const isLoading       = window.PCH.REAL_YTD === undefined;
  const ytdFacturado    = isLoading ? 0 : window.PCH.REAL_YTD;
  const presupArray     = window.PCH.presupMensual('base');
  let   ytdPresupuesto  = 0;
  for (let i=0; i<=currentMonthIdx; i++) ytdPresupuesto += presupArray[i];
  const cumplYTD    = ytdPresupuesto > 0 ? (ytdFacturado / ytdPresupuesto) * 100 : 0;
  const badgeColor  = cumplYTD >= 100 ? 'green' : cumplYTD >= 85 ? 'amber' : 'red';
  return (
    <div className="ribbon">
      <div className="ribbon-item"><span className="label">Hoy:</span><span className="fw-6">{txtHoy}</span></div>
      <div className="ribbon-divider"></div>
      <div className="ribbon-item"><span className="label">Período:</span><span className="fw-6">{txtPeriodo}</span></div>
      <div className="ribbon-divider"></div>
      <div className="ribbon-item"><span className="label">Avance mes:</span><span className="fw-6">{avanceMes}%</span></div>
      <div className="ribbon-divider"></div>
      <div className="ribbon-item"><span className="label">YTD facturado:</span><span className="fw-6 mono">{isLoading ? '...' : fmtM(ytdFacturado)} M$</span></div>
      <div className="ribbon-divider"></div>
      <div className="ribbon-item"><span className="label">YTD presupuesto:</span><span className="fw-6 mono">{fmtM(ytdPresupuesto)} M$</span></div>
      <div className="ribbon-divider"></div>
      <div className="ribbon-item"><span className="label">Cumplimiento YTD:</span><span className={`badge ${badgeColor}`}>{fmtPctSimple(cumplYTD,1)}</span></div>
      <div style={{marginLeft:'auto'}} className="ribbon-item">
        <span className="status-dot sd-warn"></span>
        <span className="text-2">6 alertas activas</span>
      </div>
    </div>
  );
}

// ============================================================
// MINI SVG CHARTS
// ============================================================
function Sparkline({ data, color='#5b8cff', height=40, width=140, fill=true }) {
  const max   = Math.max(...data, 1);
  const min   = Math.min(...data, 0);
  const range = max - min || 1;
  const pts   = data.map((v,i) => [(i/(data.length-1))*width, height-((v-min)/range)*height]);
  const path  = pts.map((p,i) => (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area  = path + ` L ${width} ${height} L 0 ${height} Z`;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{width:'100%',height}}>
      {fill && <path d={area} fill={color} fillOpacity={0.12}/>}
      <path d={path} fill="none" stroke={color} strokeWidth={1.5}/>
    </svg>
  );
}

// ============================================================
// KPI STRIP
// ============================================================
function KpiStrip() {
  const k        = window.PCH.KPI_MES;
  const mesIdx   = new Date().getMonth();
  const nombreMes= window.PCH.MESES_LARGO[mesIdx];
  const cumpl    = k.presupuesto > 0 ? k.facturado / k.presupuesto * 100 : 0;
  const cumplProy= k.presupuesto > 0 ? k.forecast_mes / k.presupuesto * 100 : 0;
  const diaHoy   = new Date().getDate();
  const diasHab  = Math.floor(diaHoy * (21/30));
  const diasRest = Math.max(1, 21 - diasHab);
  const runRateReq = Math.max(0, (k.presupuesto - k.facturado) / diasRest);
  return (
    <div className="kpi-strip">
      <div className="kpi-cell">
        <div className="kpi-label uppercase">Presupuesto {nombreMes}</div>
        <div className="kpi-value mono">{fmtM(k.presupuesto)}<span className="unit">M$</span></div>
        <div className="kpi-meta"><span className="text-3">Diario req.</span><span className="mono fw-6">{fmtM(runRateReq)}M$</span></div>
        <div className="kpi-bar"><div style={{width:'100%'}}></div></div>
      </div>
      <div className="kpi-cell">
        <div className="kpi-label">Facturado MTD</div>
        <div className="kpi-value mono">{fmtM(k.facturado)}<span className="unit">M$</span></div>
        <div className="kpi-meta"><span className="badge amber">{fmtPctSimple(cumpl)}</span><span className="text-3">vs presup.</span></div>
        <div className="kpi-bar warn"><div style={{width:Math.min(cumpl,100)+'%'}}></div></div>
      </div>
      <div className="kpi-cell">
        <div className="kpi-label">NV Emitidas MTD</div>
        <div className="kpi-value mono">{fmtM(k.nv)}<span className="unit">M$</span></div>
        <div className="kpi-meta"><span className="text-3">Backlog NV→Fact</span><span className="mono fw-6">{fmtM(k.backlog_nv)}M$</span></div>
        <div className="kpi-bar"><div style={{width:Math.min(k.presupuesto>0?k.nv/k.presupuesto*100:0,100)+'%'}}></div></div>
      </div>
      <div className="kpi-cell">
        <div className="kpi-label">Cotizado MTD</div>
        <div className="kpi-value mono">{fmtM(k.cotizado)}<span className="unit">M$</span></div>
        <div className="kpi-meta"><span className="badge blue">Conv. {k.conv_cot_nv}%</span><span className="text-3">→ NV</span></div>
        <div className="kpi-bar"><div style={{width:'92%',background:'var(--info)'}}></div></div>
      </div>
      <div className="kpi-cell">
        <div className="kpi-label">Forecast Cierre Mes</div>
        <div className="kpi-value mono">{fmtM(k.forecast_mes)}<span className="unit">M$</span></div>
        <div className="kpi-meta"><span className={`badge ${cumplProy>=100?'green':cumplProy>=85?'amber':'red'}`}>{fmtPctSimple(cumplProy)}</span><span className="text-3">proy.</span></div>
        <div className="kpi-bar bad"><div style={{width:Math.min(cumplProy,100)+'%'}}></div></div>
      </div>
      <div className="kpi-cell">
        <div className="kpi-label">Pipeline Ponderado</div>
        <div className="kpi-value mono">{fmtM(window.PCH.FORECAST_CRM_PONDERADO)}<span className="unit">M$</span></div>
        <div className="kpi-meta"><span className="text-3">Bruto</span><span className="mono fw-6">{fmtM(window.PCH.PIPELINE_CRM.reduce((a,e)=>a+e.monto,0))}M$</span></div>
        <div className="kpi-bar good"><div style={{width:'78%'}}></div></div>
      </div>
    </div>
  );
}

// ============================================================
// FAMILIAS YTD
// ============================================================
function FamiliasYTD() {
  const data = window.PCH.FAMILIAS_MONTO_YTD || [];
  if (!data.length) return <div className="text-3 fs-11 mt-2">Sin datos de familias disponibles.</div>;
  const totalNeto   = data.reduce((a,f) => a + f.monto, 0);
  const totalCto    = data.reduce((a,f) => a + (f.cto||0), 0);
  const margenTotal = totalNeto > 0 ? ((totalNeto-totalCto)/totalNeto*100) : 0;
  const mColorTotal = margenTotal>=40?'var(--positive)':margenTotal>=30?'var(--warn)':'var(--negative)';
  return (
    <table className="tbl" style={{fontSize:11}}>
      <thead><tr>
        <th>FAMILIA</th><th className="num">NETO M$</th><th className="num">COSTO M$</th>
        <th className="num">MARGEN M$</th><th className="num">MARGEN %</th>
        <th className="num">PRESUP. %</th><th className="num">Δ MARGEN</th><th className="num">% TOTAL</th>
      </tr></thead>
      <tbody>
        {data.map((f,i) => {
          const cto    = typeof f.cto         === 'number' ? f.cto         : 0;
          const margen = typeof f.margen       === 'number' ? f.margen       : 0;
          const presup = typeof f.margenPresup === 'number' ? f.margenPresup : 0;
          const delta  = presup > 0 ? margen - presup : null;
          const pct    = totalNeto > 0 ? (f.monto/totalNeto*100) : 0;
          const margenM= f.monto - cto;
          const mColor = margen>=40?'var(--positive)':margen>=30?'var(--warn)':'var(--negative)';
          return (
            <tr key={i}>
              <td className="fw-6" style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={f.fam}>{f.fam}</td>
              <td className="num mono">{fmtM(f.monto)}</td>
              <td className="num mono text-3">{fmtM(cto)}</td>
              <td className="num mono fw-6" style={{color:mColor}}>{fmtM(margenM)}</td>
              <td className="num mono fw-6" style={{color:mColor}}>{margen.toFixed(1)}%</td>
              <td className="num mono text-3">{presup>0?presup.toFixed(1)+'%':'—'}</td>
              <td className="num mono">
                {delta!==null
                  ? <span style={{color:delta>=0?'var(--positive)':'var(--negative)'}}>{delta>=0?'+':''}{delta.toFixed(1)} pp</span>
                  : <span className="text-3">—</span>}
              </td>
              <td className="num mono text-3">{pct.toFixed(1)}%</td>
            </tr>
          );
        })}
      </tbody>
      <tfoot>
        <tr className="total">
          <td>TOTAL</td>
          <td className="num mono">{fmtM(totalNeto)}</td>
          <td className="num mono">{fmtM(totalCto)}</td>
          <td className="num mono fw-6" style={{color:mColorTotal}}>{fmtM(totalNeto-totalCto)}</td>
          <td className="num mono fw-6" style={{color:mColorTotal}}>{margenTotal.toFixed(1)}%</td>
          <td className="num mono text-3">—</td><td className="num mono text-3">—</td>
          <td className="num mono text-3">100.0%</td>
        </tr>
      </tfoot>
    </table>
  );
}

// ============================================================
// MONTHLY BARS
// ============================================================
function MonthlyBars() {
  const presup  = window.PCH.presupMensual('base');
  const real    = window.PCH.REAL_2026.facturado;
  const real25  = window.PCH.REAL_2025_FACTURADO;
  const mesActual = new Date().getMonth();
  return (
    <div>
      <svg viewBox="0 0 1200 220" style={{width:'100%',height:220,overflow:'visible'}}>
        {[0,0.25,0.5,0.75,1].map(g => (
          <g key={g}>
            <line x1={40} x2={1200} y1={20+(180*(1-g))} y2={20+(180*(1-g))} stroke="#1f2734" strokeDasharray="2,3"/>
            <text x={2} y={24+(180*(1-g))} fontSize="9" fill="#6c7689">{Math.round(700*g)}</text>
          </g>
        ))}
        {presup.map((p,i) => {
          const x   = 50 + i*96;
          const r26 = real[i]   || 0;
          const r25 = real25[i] || 0;
          const max = 700;
          const hP  = p/max*180; const hR = r26/max*180; const hY = r25/max*180;
          const isPast    = i < mesActual;
          const isCurrent = i === mesActual;
          return (
            <g key={i}>
              <rect x={x}    y={20+180-hY} width={20} height={hY} fill="#64748b" rx={2}/>
              <rect x={x+22} y={20+180-hP} width={20} height={hP} fill="#1e40af" rx={2}/>
              {(isPast||isCurrent) && <rect x={x+44} y={20+180-hR} width={20} height={hR} fill={isCurrent?'#f59e0b':'#3b82f6'} rx={2}/>}
              <text x={x+32} y={215} fontSize="10" fill="#aab3c2" textAnchor="middle">{window.PCH.MESES[i]}</text>
              {(isPast||isCurrent)&&r26>0&&<text x={x+32} y={20+180-Math.max(hR,hP)-4} fontSize="9" fill="#e6ebf2" textAnchor="middle" fontWeight="600">{Math.round(r26/p*100)}%</text>}
            </g>
          );
        })}
      </svg>
      <div className="flex gap-3 fs-11 mt-2" style={{justifyContent:'center'}}>
        <span><span style={{display:'inline-block',width:10,height:10,background:'#64748b',borderRadius:2,marginRight:4}}></span>Real 2025</span>
        <span><span style={{display:'inline-block',width:10,height:10,background:'#1e40af',borderRadius:2,marginRight:4}}></span>Presup. 2026</span>
        <span><span style={{display:'inline-block',width:10,height:10,background:'#3b82f6',borderRadius:2,marginRight:4}}></span>Real 2026</span>
        <span><span style={{display:'inline-block',width:10,height:10,background:'#f59e0b',borderRadius:2,marginRight:4}}></span>Mes actual</span>
      </div>
    </div>
  );
}

// ============================================================
// MIX PRODUCTOS
// ============================================================
function MixProductos() {
  const data = window.PCH.MIX_FAMILIA || [];
  if (!data.length) return <div className="card"><div className="text-center text-3 mt-4">Esperando datos...</div></div>;
  return (
    <div className="card">
      <div className="card-head"><div className="card-title uppercase">Mix de Productos · Margen Real vs Presupuestado</div></div>
      <table className="tbl" style={{fontSize:11}}>
        <thead><tr>
          <th>FAMILIA</th><th className="num">PRESUP. %</th><th className="num">REAL %</th>
          <th className="num">Δ PP</th><th>DISTRIB.</th>
          <th className="num">MRG REAL</th><th className="num">MRG PRESUP.</th><th className="num">Δ MRG</th>
        </tr></thead>
        <tbody>
          {data.map((r,i) => {
            const p_pct=typeof r.p_pct==='number'?r.p_pct:0;
            const r_pct=typeof r.r_pct==='number'?r.r_pct:0;
            const d_pp =typeof r.d_pp ==='number'?r.d_pp :0;
            const m_real=typeof r.m_real==='number'?r.m_real:0;
            const m_pre =typeof r.m_pre ==='number'?r.m_pre :0;
            const m_d   =typeof r.m_d   ==='number'?r.m_d   :0;
            return (
              <tr key={i}>
                <td className="fw-6" style={{maxWidth:120,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={r.fam||'—'}>{r.fam||'—'}</td>
                <td className="num mono">{p_pct.toFixed(1)}%</td>
                <td className="num mono">{r_pct.toFixed(1)}%</td>

    ...days.map(d   => d&&d.fact?d.fact:0),

    <div>

              {nv>0&&<text x={x+24} y={20+170-hN-3} fontSize="8" fill="#86efac" textAnchor="middle">{nv.toFixed(0)}</text>}
              <text x={x+16} y={212} fontSize="9" fill="#6c7689" textAnchor="middle">{diaNum}</text>

// ============================================================
// HOY CARD
// ============================================================
function HoyCard() {
  const k      = D2.KPI_MES || {};
  const diaIdx = new Date().getDate()-1;
  const grafHoy= D2.graficoDiario&&D2.graficoDiario[diaIdx];
  const facHoy = grafHoy&&grafHoy.fact?grafHoy.fact:0;
  const nvHoy  = D2.graficoDiarioNV&&D2.graficoDiarioNV[diaIdx]?(D2.graficoDiarioNV[diaIdx].nv||0):0;
  const ppto   = k.presupuesto||0;
  const facMes = k.facturado  ||0;
  const diaHoy = new Date().getDate();
  const diasHab= Math.floor(diaHoy*(21/30));
  const diasRest=Math.max(1,21-diasHab);
  const faltante   = Math.max(0,ppto-facMes);
  const runRateReq = faltante/diasRest;
  const runRateAct = facMes/Math.max(1,diasHab);
  return (
    <div>
      <div className="text-3 fs-10 uppercase">Facturado hoy</div>
      <div className="mono fw-7" style={{fontSize:30,color:'var(--accent)'}}>
        {window.fmtM(facHoy)}<span className="text-3 fs-12" style={{marginLeft:4}}>M$</span>
      </div>
      <div className="flex center-y gap-2 mt-1">
        <span className="text-3 fs-11">Run-rate actual: {window.fmtM(runRateAct)} M$/día</span>

// ============================================================
// SEMANAS
// ============================================================
function Semanas() {
  let data = D2.SEMANAS;
  const mesesCortos = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const mesActual   = mesesCortos[new Date().getMonth()];
  if (!data||data.length===0||typeof data[0].vendido==='undefined') {
    const ppto=(D2.KPI_MES&&D2.KPI_MES.presupuesto)?D2.KPI_MES.presupuesto/5:100;
    data=[{sem:'S1',presup:ppto,vendido:0,isFuture:false},{sem:'S2',presup:ppto,vendido:0,isFuture:true},
          {sem:'S3',presup:ppto,vendido:0,isFuture:true},{sem:'S4',presup:ppto,vendido:0,isFuture:true},
          {sem:'S5',presup:ppto,vendido:0,isFuture:true}];
  }
  const semanas = data.map((s,idx) => ({...s,semLimpia:`S${idx+1} ${mesActual}`+(s.isFuture?' (proy)':''),vendido:s.vendido||0}));
  const max = Math.max(...semanas.map(s=>Math.max(s.vendido,s.presup,s.proy||0)))||1;
  return (
    <div>
      {semanas.map((s,i) => {
        const cumpl=!s.isFuture?(s.vendido/s.presup*100):null;
        const bc=cumpl!==null?(cumpl>=100?'green':cumpl>=85?'amber':cumpl===0?'gray':'red'):'gray';
        return (
          <div key={i} className="mb-2" style={{paddingBottom:8,borderBottom:'1px solid var(--border-soft)'}}>
            <div className="flex between center-y mb-1">
              <span className="fw-6 fs-12">{s.semLimpia}</span>
              {cumpl!==null?<span className={`badge ${bc}`}>{cumpl.toFixed(0)}%</span>:<span className="badge gray">Proyectada</span>}
            </div>
            <div style={{position:'relative',height:22}}>
              <div style={{position:'absolute',left:0,top:0,height:'100%',width:Math.min(100,(s.presup/max*100))+'%',background:'#1f2734',borderRadius:3}}></div>
              {s.vendido>0&&<div style={{position:'absolute',left:0,top:0,height:'100%',width:Math.min(100,(s.vendido/max*100))+'%',background:'#5b8cff',borderRadius:3}}></div>}
              {s.isFuture&&s.proy>0&&<div style={{position:'absolute',left:0,top:0,height:'100%',width:Math.min(100,(s.proy/max*100))+'%',background:'repeating-linear-gradient(45deg,#475569 0 4px,#1f2734 4px 8px)',borderRadius:3}}></div>}
            </div>
            <div className="flex between fs-10 text-3 mt-1">
              <span>Presup: {s.presup.toFixed(1)} M$</span>
              <span>{!s.isFuture?`Real: ${s.vendido.toFixed(1)} M$`:`Proy: ${(s.proy||0).toFixed(1)} M$`}</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ============================================================
// HEATMAP
// ============================================================
function Heatmap() {
  const weeks       = 16;
  const mesesCortos = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const currentM    = new Date().getMonth();
  const labelsMeses = [];
  for (let i=3;i>=0;i--){let m=currentM-i;if(m<0)m+=12;labelsMeses.push(mesesCortos[m]);}
  return (
    <div>
      <div style={{display:'grid',gridTemplateColumns:'24px repeat('+weeks+', 1fr)',gap:2}}>
        <div></div>
        {Array.from({length:weeks}).map((_,w)=>(
          <div key={w} style={{fontSize:8,color:'var(--text-3)',textAlign:'center'}}>{w%4===0?'S'+(w+1):''}</div>
        ))}
        {['L','M','M','J','V'].map((d,row)=>(
          <React.Fragment key={row}>
            <div style={{fontSize:9,color:'var(--text-3)'}}>{d}</div>
            {Array.from({length:weeks}).map((_,w)=>{
              const idx=w*5+row;
              if(idx>75)return <div key={w}></div>;
              const intensity=Math.random();
              const bg=intensity>0.7?'#22c55e':intensity>0.5?'#10b981':intensity>0.3?'#5b8cff':intensity>0.15?'#3b4a64':'#1f2734';
              return <div key={w} className="heat-cell" style={{background:bg}}></div>;
            })}
          </React.Fragment>
        ))}
      </div>
      <div className="flex between fs-10 text-3 mt-2">{labelsMeses.map((l,i)=><span key={i}>{l}</span>)}</div>
      <div className="flex gap-2 fs-10 mt-2 center-y">
        <span className="text-3">Menos</span>
        {['#1f2734','#3b4a64','#5b8cff','#10b981','#22c55e'].map(c=><div key={c} style={{width:14,height:14,background:c,borderRadius:2}}></div>)}
        <span className="text-3">Más</span>
      </div>
    </div>
  );
}

// ============================================================
// CIERRES HOY
// ============================================================
const getStageScore = (stage) => {
  const s=(stage||'').toLowerCase();
  if(s.includes('ganad'))return 100; if(s.includes('compromiso'))return 80;
  if(s.includes('negociacion'))return 60; if(s.includes('seguimiento'))return 40;
  if(s.includes('cotizacion'))return 20; if(s.includes('lead'))return 10;
  return 0;
};

function CierresHoy() {
  let items=(D2.diarias&&D2.diarias.cierresPendientes)?[...D2.diarias.cierresPendientes]:[];
  items=items.sort((a,b)=>{const d=getStageScore(b.etapa)-getStageScore(a.etapa);return d!==0?d:(b.monto||0)-(a.monto||0);});
  const total=items.reduce((s,it)=>s+(it.monto||0),0);
  if(!items.length)return <div className="text-center text-3 mt-3 fs-11">No hay cierres pendientes detectados.</div>;
  return (
    <div>
      <div style={{maxHeight:220,overflowY:'auto',paddingRight:8}}>
        {items.map((it,i)=>(
          <div key={i} className="mb-2" style={{paddingBottom:8,borderBottom:'1px solid var(--border-soft)'}}>
            <div className="flex between center-y">
              <span className="fs-12 fw-6">{it.negocio}</span>
              <span className="mono fw-7">{it.monto.toFixed(1)} M$</span>
            </div>
            <div className="flex between fs-10 text-3 mt-1">
              <span>{it.etapa} · {it.vendedor}</span>
              <span className={it.dias>=15?'t-down':it.dias>=10?'t-warn':'text-3'}>{it.dias} días</span>
            </div>
          </div>
        ))}
      </div>
      <div className="text-center fs-11 mt-2 pt-2" style={{borderTop:'1px solid var(--border-soft)'}}>
        <span className="text-2 fw-6">Total: {total.toFixed(1)} M$</span>
      </div>
    </div>
  );
}

// ============================================================
// FLOW CARD
// ============================================================
function FlowCard({ label, total, n, delta, color }) {
  const trend=[4,7,6,9,8,10,12];
  return (
    <div>
      <div className="card-head"><div className="card-title">{label}</div><window.Delta v={delta}/></div>
      <div className="flex between center-y">
        <div><div className="mono fw-7" style={{fontSize:22}}>{total}</div><div className="text-3 fs-10">{n} operaciones</div></div>
        <div style={{width:120}}><window.Sparkline data={trend} color={color} height={36}/></div>
      </div>
      <div className="flex between mt-2 fs-10 text-3">
        <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Lun</span><span>HOY</span>
      </div>
    </div>
  );
}

// ============================================================
// MOV TABLE
// ============================================================
function MovTable() {
  let movs=(D2.diarias&&D2.diarias.movimientosHoy)?D2.diarias.movimientosHoy:[];
  movs=movs.sort((a,b)=>getStageScore(b.etapa)-getStageScore(a.etapa));
  if(!movs.length)return <div className="text-center text-3 mt-4" style={{padding:'20px 0'}}>Aún no hay movimientos registrados hoy en el CRM.</div>;
  const tipoColor={COT:'blue',NV:'amber',FACT:'green',ETAPA:'gray',WIN:'green'};
  return (
    <div style={{maxHeight:350,overflowY:'auto',paddingRight:5}}>
      <table className="tbl">
        <thead style={{position:'sticky',top:0,backgroundColor:'var(--bg-2)',zIndex:1}}>
          <tr><th>Fecha</th><th>Tipo</th><th>Cliente</th><th>Vendedor</th><th className="num">Monto</th><th>Origen</th><th>Detalle</th></tr>
        </thead>
        <tbody>
          {movs.map((m,i)=>{
            let tipoStr='ETAPA',claseTipo=tipoColor.ETAPA;
            const et=(m.etapa||'').toLowerCase();
            if(et.includes('cot')){tipoStr='COT';claseTipo=tipoColor.COT;}
            else if(et.includes('nv')||et.includes('nota de venta')){tipoStr='NV';claseTipo=tipoColor.NV;}
            else if(et.includes('ganad')){tipoStr='WIN';claseTipo=tipoColor.WIN;}
            return (
              <tr key={i}>
                <td className="mono text-3">Hoy</td>
                <td><span className={'badge '+claseTipo}>{tipoStr}</span></td>
                <td className="strong">{m.negocio}</td>
                <td className="text-2">{m.vendedor}</td>
                <td className="num mono strong">{m.monto.toFixed(1)} M$</td>
                <td><span className="text-3 fs-10 mono">{m.origen}</span></td>
                <td className="text-3 fs-11">{m.etapa}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ============================================================
// COTIZACIONES SIN MOVIMIENTO
// ============================================================
function Cotizaciones() {
  let cots=(D2.diarias&&D2.diarias.sinMovimiento)?D2.diarias.sinMovimiento:[];
  cots=cots.sort((a,b)=>{const d=getStageScore(b.etapa)-getStageScore(a.etapa);return d!==0?d:b.dias-a.dias;});
  const total=cots.reduce((s,c)=>s+(c.monto||0),0);
  if(!cots.length)return <div className="text-center text-3 mt-3 fs-11">¡Sin cotizaciones estancadas!</div>;
  return (
    <div>
      <div style={{maxHeight:350,overflowY:'auto',paddingRight:8}}>
        {cots.map((c,i)=>(
          <div key={i} className="mb-2" style={{paddingBottom:8,borderBottom:'1px solid var(--border-soft)'}}>
            <div className="flex between">
              <span className="fs-12 fw-6">{c.negocio}</span>
              <span className="badge red">{c.dias}d</span>
            </div>
            <div className="flex between mt-1 fs-11">
              <span className="text-3">[{c.etapa||'Sin etapa'}] {c.vendedor}</span>
              <span className="mono fw-6">{c.monto.toFixed(1)} M$</span>
            </div>
          </div>
        ))}
      </div>
      <div className="text-center fs-11 mt-2 pt-2" style={{borderTop:'1px solid var(--border-soft)'}}>
        <span className="text-2 fw-6">Total estancado: {total.toFixed(1)} M$</span>
      </div>
    </div>
  );
}

// ============================================================
// MIX VENDEDOR
// ============================================================
function MixVendedor() {
  const activos   = D3.VENDEDORES.filter(v => v.activo && v.real && v.real.facturado>0);
  const totalFact = activos.reduce((a,v) => a+(v.real?.facturado||0), 0);
  if (!activos.length) return <div className="text-3 fs-11 text-center mt-3">Cargando datos del equipo...</div>;
  return (
    <div>
      {activos.map((v,i) => {
        const pct   = totalFact>0?(v.real.facturado/totalFact*100):0;
        const cumpl = v.metaMensual>0?(v.real.facturado/v.metaMensual*100):0;
        return (
          <div key={i} className="mb-3">
            <div className="flex between fs-12 mb-1">
              <span className="fw-6">{v.nombre}</span>
              <span className="mono fw-6 fs-11">{v.real.facturado.toFixed(1)} M$ · {pct.toFixed(1)}% del total</span>
            </div>
            <div style={{height:20,background:'var(--bg-3)',borderRadius:3,overflow:'hidden',position:'relative'}}>
              <div style={{width:Math.min(100,cumpl)+'%',height:'100%',
                background:cumpl>=100?'var(--positive)':cumpl>=80?'var(--accent)':'var(--warn)',
                borderRadius:3,display:'flex',alignItems:'center',paddingLeft:6,
                fontSize:10,color:'white',fontWeight:600}}>
                {cumpl>10?cumpl.toFixed(0)+'% de meta':''}
              </div>
            </div>
            <div className="flex between fs-10 text-3 mt-1">
              <span>Meta: {v.metaMensual||'—'} M$</span>
              <span>Facturado: {v.real.facturado.toFixed(1)} M$</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

    </div>
  );
}

// ============================================================
// METRIC ROW
// ============================================================
function MetricRow({ nombre, fuente, calc, unit }) {
  const colores = {
    'Presupuesto':'blue','Manager ERP':'green','Manager':'green',
    'GHL':'gray','Calculado':'amber','Manual':'gray',
    'Acuerdo':'gray','BUK / RRHH':'gray',
  };
  const bc = colores[fuente] || 'gray';
  return (
    <tr>
      <td className="strong">{nombre}</td>
      <td><span className={'badge '+bc}>{fuente}</span></td>
      <td className="text-2 fs-12">{calc}</td>
      <td className="mono text-3 fs-11">{unit}</td>
    </tr>
  );
}

window.GlosarioTab = GlosarioTab;
</script>

<!-- ══ REACT APP ROOT ════════════════════════════════════════ -->
<script type="text/babel">
  const { useState, useEffect } = React;

  function App({ initialPayload, userEmail }) {
    const [tab,      setTab]      = useState('exec');
    const [scenario, setScenario] = useState('base');
    const [,         force]       = useState(0);

    useEffect(() => {
      window.__rerender = () => force(x => x + 1);
      const interval = setInterval(async () => {
        const user = firebase.auth().currentUser;
        if (!user) return;
        try {
          const res     = await fetch(`${APPS_SCRIPT_URL}?action=data`);
          const payload = await res.json();
          if (window.__applyPayload) window.__applyPayload(payload);
          force(x => x + 1);
        } catch(e) { console.warn('Refresco fallido:', e); }
      }, 300000);
      return () => clearInterval(interval);
    }, []);

    return (
      <>
        {window.Topbar && (
          <window.Topbar
            tab={tab} setTab={setTab}
            scenario={scenario} setScenario={setScenario}
            userEmail={userEmail}
            onLogout={() => firebase.auth().signOut()}
          />
        )}
        <div className="page">
          {window.Ribbon   && <window.Ribbon/>}
          {tab === 'exec'     && window.ExecTab     && <window.ExecTab/>}
          {tab === 'daily'    && window.DailyTab    && <window.DailyTab/>}
          {tab === 'team'     && window.TeamTab     && <window.TeamTab/>}
          {tab === 'glosario' && window.GlosarioTab && <window.GlosarioTab/>}
        </div>
      </>
    );
  }

  window.__renderApp = function(payload, userEmail) {
    ReactDOM.createRoot(document.getElementById('root')).render(
      <App initialPayload={payload} userEmail={userEmail}/>
    );
  };
</script>
